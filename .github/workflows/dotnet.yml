name: DynamicReporting.Api CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build
      run: dotnet build DynamicReporting.Api/DynamicReporting.Api.csproj --configuration Release
      
    - name: Test
      run: dotnet test --configuration Release --no-build
